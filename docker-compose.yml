services:
  neo4j:
    image: neo4j:5-community
    container_name: research_kg_neo4j
    ports:
      - "7474:7474" # Neo4j Browser Web UI
      - "7687:7687" # Bolt protocol endpoint
    environment:
      - NEO4J_AUTH=neo4j/researchkg2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_allow__csv__import__from__file__urls=true
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - ./data/processed:/var/lib/neo4j/import:ro
    restart: unless-stopped

volumes:
  neo4j_data:
